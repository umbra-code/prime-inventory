version: 2
# master only receives tested, tagged releases; updates go through development.
# Note: Dependabot reads this file from the default branch (master).
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: development
    schedule:
      interval: weekly
    groups:
      # New Primes arrive through this package; keep it in its own PR.
      warframe-data:
        patterns: ["@wfcd/items"]
      minor-and-patch:
        patterns: ["*"]
        exclude-patterns: ["@wfcd/items"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: development
    schedule:
      interval: monthly
