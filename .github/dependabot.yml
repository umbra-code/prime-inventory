version: 2
# master only receives tested, tagged releases; updates go through development.
# Note: Dependabot reads this file from the default branch (master).
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: development
    schedule:
      interval: weekly
    # New Primes arrive through @wfcd/items, which the Update Warframe data
    # workflow keeps current and releases on its own.
    ignore:
      - dependency-name: "@wfcd/items"
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: development
    schedule:
      interval: monthly
